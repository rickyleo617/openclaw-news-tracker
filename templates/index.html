<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpenClaw 新闻追踪</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #333;
            line-height: 1.6;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            min-height: 100vh;
        }
        
        header {
            text-align: center;
            padding: 40px 0 30px;
            color: white;
        }
        
        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
        }
        
        .subtitle {
            font-size: 1.1rem;
            opacity: 0.9;
        }
        
        .last-updated {
            background: rgba(255,255,255,0.2);
            padding: 8px 16px;
            border-radius: 20px;
            display: inline-block;
            margin-top: 15px;
            font-size: 0.9rem;
        }
        
        .news-list {
            background: white;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        
        .news-item {
            padding: 20px;
            border-bottom: 1px solid #eee;
            transition: background-color 0.2s;
        }
        
        .news-item:last-child {
            border-bottom: none;
        }
        
        .news-item:hover {
            background-color: #f8f9fa;
        }
        
        .news-title {
            font-size: 1.3rem;
            font-weight: 600;
            margin-bottom: 8px;
            color: #2c3e50;
        }
        
        .news-title a {
            color: inherit;
            text-decoration: none;
        }
        
        .news-title a:hover {
            color: #667eea;
        }
        
        .news-summary {
            color: #666;
            margin-bottom: 12px;
            line-height: 1.5;
        }
        
        .news-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85rem;
            color: #888;
        }
        
        .news-source {
            background: #e9ecef;
            padding: 4px 8px;
            border-radius: 12px;
            font-weight: 500;
        }
        
        .news-date {
            font-size: 0.8rem;
        }
        
        .no-news {
            text-align: center;
            padding: 40px;
            color: #666;
        }
        
        footer {
            text-align: center;
            color: white;
            padding: 30px 0 20px;
            font-size: 0.9rem;
            opacity: 0.8;
        }
        
        @media (max-width: 600px) {
            .container {
                padding: 15px;
            }
            
            h1 {
                font-size: 2rem;
            }
            
            .news-item {
                padding: 15px;
            }
            
            .news-title {
                font-size: 1.2rem;
            }
            
            .news-meta {
                flex-direction: column;
                align-items: flex-start;
                gap: 5px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🤖 OpenClaw 新闻追踪</h1>
            <p class="subtitle">全球OpenClaw相关报道每日更新</p>
            <div class="last-updated">最后更新: {{ last_updated }}</div>
        </header>
        
        <main class="news-list">
            {% if news_items %}
                {% for item in news_items %}
                <article class="news-item">
                    <h2 class="news-title">
                        <a href="{{ item.url }}" target="_blank" rel="noopener noreferrer">
                            {{ item.title }}
                        </a>
                    </h2>
                    <p class="news-summary">{{ item.summary }}</p>
                    <div class="news-meta">
                        <span class="news-source">{{ item.source }}</span>
                        <span class="news-date">{{ item.published_at|format_date }}</span>
                    </div>
                </article>
                {% endfor %}
            {% else %}
                <div class="no-news">
                    <p>暂无OpenClaw相关新闻</p>
                </div>
            {% endif %}
        </main>
        
        <footer>
            <p>每天早上8点自动更新 | Powered by OpenClaw</p>
        </footer>
    </div>
    
    <script>
        // 移动端优化
        document.addEventListener('DOMContentLoaded', function() {
            // 点击外部链接在新标签页打开
            const externalLinks = document.querySelectorAll('a[href^="http"]');
            externalLinks.forEach(link => {
                link.setAttribute('target', '_blank');
                link.setAttribute('rel', 'noopener noreferrer');
            });
        });
    </script>
</body>
</html>
